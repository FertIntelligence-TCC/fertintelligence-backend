spring.application.name=fertintelligence

# DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fertintelligencebd}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fertintelligenceadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:adubosdaora}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.show-sql=true

# SECURITY / JWT
jwt.public.key=classpath:public.pem
jwt.private.key=classpath:private.pem

logging.level.org.springframework.security=DEBUG

# FRONTEND
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# SEEDERS
app.seed.crop-fertilization-tables=true

# PROFILE
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# SERVER
server.port=${PORT:8080}
