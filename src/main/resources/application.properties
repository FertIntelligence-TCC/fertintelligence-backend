spring.application.name=fertintelligence

# SERVER
server.port=${PORT:8080}

# DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fertintelligencebd}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fertintelligenceadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:adubosdaora}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
# Em dev, mantém update por padrão. Em produção, application-prod.properties sobrescreve para none.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}

# FLYWAY
# Flyway aplica migrations SQL versionadas em classpath:db/migration.
# Em bancos novos, deixe baseline-on-migrate=false para executar todo o histórico.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.validate-on-migrate=true

# SECURITY / JWT
jwt.public.key=classpath:public.pem
jwt.private.key=classpath:private.pem

logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:DEBUG}

# FRONTEND
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# SEEDERS
# Em dev, os seeders podem rodar. Em produção, application-prod.properties sobrescreve para false.
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.crop-fertilization-tables=${APP_SEED_CROP_FERTILIZATION_TABLES:true}

# PROFILE
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# FERT-AI
fert-ai.base-url=${FERT_AI_BASE_URL:https://fertintelligence-fert-ai.onrender.com}
