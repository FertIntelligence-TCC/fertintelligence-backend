# PROFILE PROD
# Bind na porta informada pelo Render. Fallback 8080 para execução local do profile prod.
server.port=${PORT:8080}

# JPA / HIBERNATE
# Em produção, não alterar nem validar schema no startup.
# O schema deve ser preparado manualmente ou por migration antes do deploy.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# FLYWAY
# O banco de produção já possui schema legado; baseline-on-migrate registra o baseline
# na primeira execução para evitar recriar tabelas existentes e permitir novas migrations.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:20260618}
spring.flyway.baseline-description=${SPRING_FLYWAY_BASELINE_DESCRIPTION:Baseline existing Render database before 20260619 migrations}
spring.flyway.validate-on-migrate=true

# SEEDERS
# Seeders não devem rodar em produção para evitar timeout no startup.
app.seed.enabled=false
app.seed.crop-fertilization-tables=false
